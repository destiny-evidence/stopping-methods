[project]
name = "stopping-methods"
version = "3.0.0"
requires-python = ">=3.13,<3.14"

dependencies = [
    "httpx==0.28.1",
    "lxml==6.1.1",
    "matplotlib==3.11.0",
    "numpy==2.5.1",
    "pandas[excel]==3.0.3",
    "pillow==12.3.0",
    "pyarrow==21.0.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "requests==2.34.2",
    "rispy==0.10.0",
    "tqdm==4.68.4",
    "typer==0.26.8",
]

[project.optional-dependencies]
experiments = [
    "transformers[torch]==4.56.2",
    "scikit-learn==1.7.2",
    "scipy==1.16.2",
    "nltk==3.9.1",
    "lightgbm==4.6.0",
    "accelerate==1.10.1",
    "datasets==4.1.1",
    "optuna==4.5.0",
]
jupyter = [
    "jupyter==1.1.1",
    "jupyter_contrib_nbextensions==0.7.0",
    "jupyter_server==2.16.0",
    "jupyter_server_fileid==0.9.3",
    "jupyter_server_ydoc==2.1.0rc0",
    "nbclassic==1.3.1",
]

[dependency-groups]
dev = [
    "ruff>=0.15.20",
    "mypy[faster-cache]==2.1.0",
]


[tool.ruff]
line-length = 160
indent-width = 4
target-version = "py313"
include = ['simulation/**/*.py', 'shared/**/*.py', 'rankings/**/*.py', 'methods/**/*.py', 'loaders/**/*.py']
exclude = []

[tool.ruff.lint]
select = ["C", "E", "F", "W", "B", "B9"]
ignore = ["E203", "E501", "E712", "E741", "B010", "B009"]  # , "E126", "W503",

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
# Flag errors (`C901`) whenever the complexity level exceeds 5.
max-complexity = 12

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "single"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.mypy]
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
strict = true
follow_imports = "silent"
check_untyped_defs = true
disallow_any_generics = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
no_implicit_reexport = false
strict_optional = true
explicit_package_bases = false
show_traceback = true
incremental = false

files = ['simulation', 'shared', 'rankings', 'methods', 'loaders']
exclude = []

# for strict mypy: (this is the tricky one :-))
disallow_untyped_defs = true

